# servicio-gateway · API gateway de Guardián Centinela (Kipu) · EP3.
# En AWS lo publica Caddy (HTTPS, puertos 80/443); en local se publica en el 8080.
#   /                    -> front
#   /api/                -> servicio-dominio (API de negocio: /api/predict, /api/predicciones, /api/revision,
#                           /api/dashboard, /api/health). nginx quita /api: el dominio recibe /predict, /health...
#   /docs, /openapi.json -> servicio-dominio (documentación OpenAPI, pública)
# servicio-ia NO tiene ruta pública: el dominio la llama por la red interna (http://ia:8000) y el DNS de Docker
# reparte entre las 2 réplicas. La clave X-API-Key y el límite por cliente (429) los aplica el dominio.
worker_processes auto;
events { worker_connections 1024; }

http {
    # DNS interno de Docker: re-resuelve cada 5 s; así una réplica que reinicia con otra IP vuelve al pool
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    log_format kipu '$remote_addr [$time_iso8601] "$request" $status '
                    'upstream=$upstream_addr up_status=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout kipu;
    error_log  /dev/stderr warn;
    server_tokens off;
    client_max_body_size 64k;

    # Tope global de tasa (seguridad): 400 req/s ≈ 4 veces el peak del caso (5.500/min = 92 req/s)
    map $request_method $tope { default "kipu"; }
    limit_req_zone $tope zone=api:1m rate=400r/s;

    upstream front_up   { zone front 64k;   server front:80 resolve; }
    upstream dominio_up { zone dominio 64k; server dominio:8000 resolve max_fails=2 fail_timeout=10s; keepalive 16; }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Upstream $upstream_addr always;      # qué réplica respondió (útil en la defensa)

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /health {
            access_log off; default_type application/json;
            return 200 '{"status":"healthy","servicio":"servicio-gateway"}';
        }

        location /api/ {
            limit_except GET POST { deny all; }
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://dominio_up/;            # la barra final quita /api
            proxy_connect_timeout 1s;
            # > IA_TIMEOUT_MS del dominio (6 s): un cold start de SageMaker alcanza a responder (o cae en reserva)
            proxy_read_timeout 8s;
            # POST /predict escribe en la base: NO se reintenta en otro upstream (evita decisiones duplicadas)
            proxy_next_upstream off;
        }

        # Documentación de la API (pública). El dominio corre con ROOT_PATH=/api, así Swagger llama /api/...
        location = /docs         { proxy_pass http://dominio_up/docs; }
        location = /openapi.json { proxy_pass http://dominio_up/openapi.json; }

        location / { proxy_pass http://front_up; }

        # Si el servicio no responde, el gateway devuelve un JSON estable (no una página HTML)
        error_page 502 503 504 = @caido;
        location @caido {
            default_type application/json;
            return 503 '{"error":"servicio_no_disponible","detalle":"el gateway no obtuvo respuesta del servicio","request_id":"$request_id"}';
        }
        error_page 429 = @limite;
        location @limite { default_type application/json; return 429 '{"error":"demasiadas_peticiones"}'; }
    }
}
