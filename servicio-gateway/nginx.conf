# servicio-gateway · API gateway de Guardián Centinela (Kipu). ÚNICO servicio con puerto publicado (8080).
#   /              -> front
#   /api/dominio/  -> servicio-dominio (API de negocio)
#   /api/ia/       -> servicio-ia (2 réplicas, round-robin)
worker_processes auto;
events { worker_connections 1024; }

http {
    # DNS interno de Docker: re-resuelve cada 5 s; así una réplica que reinicia con otra IP vuelve al pool
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    log_format kipu '$remote_addr [$time_iso8601] "$request" $status '
                    'upstream=$upstream_addr up_status=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout kipu;
    error_log  /dev/stderr warn;
    server_tokens off;
    client_max_body_size 64k;

    # Tope global de tasa (seguridad): 400 req/s ≈ 4 veces el peak del caso (5.500/min = 92 req/s)
    map $request_method $tope { default "kipu"; }
    limit_req_zone $tope zone=api:1m rate=400r/s;

    upstream front_up   { zone front 64k;   server front:80 resolve; }
    upstream dominio_up { zone dominio 64k; server dominio:8000 resolve max_fails=2 fail_timeout=10s; keepalive 16; }
    upstream ia_up {
        zone ia 64k;
        # 'resolve' + DNS de Docker = una entrada por réplica de "ia"; nginx reparte round-robin.
        # Si una réplica no responde, se marca caída 10 s y la petición se reintenta en la otra.
        server ia:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Upstream $upstream_addr always;      # qué réplica respondió (útil en la defensa)

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /health {
            access_log off; default_type application/json;
            return 200 '{"status":"healthy","servicio":"servicio-gateway"}';
        }

        location /api/dominio/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://dominio_up/;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }

        location /api/ia/ {
            # La IA solo acepta GET (health) y POST (/predict)
            limit_except GET POST { deny all; }
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://ia_up/;
            proxy_connect_timeout 300ms;
            proxy_read_timeout 2s;
            # /predict no escribe nada: es seguro reintentarlo en la otra réplica
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        location / { proxy_pass http://front_up; }

        # Si el servicio no responde, el gateway devuelve un JSON estable (no una página HTML)
        error_page 502 503 504 = @caido;
        location @caido {
            default_type application/json;
            return 503 '{"error":"servicio_no_disponible","detalle":"el gateway no obtuvo respuesta del servicio","request_id":"$request_id"}';
        }
        error_page 429 = @limite;
        location @limite { default_type application/json; return 429 '{"error":"demasiadas_peticiones"}'; }
    }
}
