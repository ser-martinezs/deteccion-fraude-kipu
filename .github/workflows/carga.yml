name: carga

# Pipeline del servicio de carga + base de datos (EP2, secciones 2.1, 2.2 y 2.5)
#   Pull request hacia dev o main : tratamiento + test de carga idempotente contra PostgreSQL + build y prueba de la imagen (NO publica)
#   Push a main                   : lo anterior + publicación en GHCR con los tags sha-<commit> y latest
#   Tag ep2 sobre main            : re-etiqueta como :ep2 la MISMA imagen ya probada para ese commit
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: [ep2]

concurrency:
  group: carga-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEN: servicio-carga
  PYTHON_VERSION: "3.11"

jobs:
  construir:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: kipu, POSTGRES_USER: kipu, POSTGRES_PASSWORD: kipu }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kipu" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kipu:kipu@localhost:5432/kipu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependencias
        run: python -m pip install pandas==2.2.3 numpy==2.0.2 pytest==8.3.3 -r servicio-carga/requirements.txt

      # 1. Las tablas que se cargan SIEMPRE salen del tratamiento; nada tratado se sube a mano
      - name: Tratamiento de datos (preparar.py)
        run: python datos/preparar.py --entrada datos/crudo --salida datos/tratado

      # 2. La carga corre dos veces contra un PostgreSQL real y no duplica filas
      - name: Test del servicio de carga (idempotencia)
        run: python -m pytest servicio-carga -q

      # 3. Imagen linux/amd64: se construye, se prueba corriéndola dos veces y solo entonces se publica
      - name: Nombre de la imagen en GHCR (en minúsculas)
        id: img
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGEN}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Metadatos de la imagen (incluye org.opencontainers.image.revision)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.nombre }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir la imagen (no se publica todavía)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servicio-carga/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGEN }}:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Prueba de la imagen (corre dos veces contra la base y termina con código 0)
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" "${IMAGEN}:ci"
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" "${IMAGEN}:ci" | tee /tmp/segunda.txt
          grep -q "transacciones  leídas= *[0-9]*  insertadas= *0" /tmp/segunda.txt \
            || { echo "::error::la segunda carga insertó filas: no es idempotente"; exit 1; }

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la imagen probada (sha-… y latest)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "${IMAGEN}:ci" "$tag"
            docker push "$tag"
          done

  publicar-ep2:
    if: github.ref_type == 'tag' && github.ref_name == 'ep2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El tag ep2 debe estar sobre un commit de main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::el tag ep2 no está sobre main"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetar como ep2 la imagen ya probada de este commit
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGEN}"
          origen="${imagen}:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$origen" >/dev/null 2>&1 || { echo "::error::no existe $origen"; exit 1; }
          docker buildx imagetools create -t "${imagen}:ep2" "$origen"
